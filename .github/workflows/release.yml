name: release

# Releases start one of two ways:
# - Actions > release > Run workflow, with the version (1.14.0-net.1). The workflow builds that
#   commit, then creates the tag and the release together.
# - Pushing a tag (v1.14.0-net.1) does the same for the tagged commit.
# Either way the notes are that version's section of CHANGELOG-net.md, which must exist first,
# and versions.json on net is updated once the zip is up. Run workflow with no version builds
# a test zip and releases nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.14.0-net.1. Leave empty for a test build only.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            CHANGELOG-net.md
          sparse-checkout-cone-mode: false

      - name: Work out the tag, and check it can be released
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME" publish=true
          elif [ -n "$VERSION" ]; then
            tag="v${VERSION#v}" publish=true
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists; pick the next version"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME" publish=false
          fi
          if [ "$publish" = true ]; then
            echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-net\.[0-9]+)?$' || {
              echo "::error::$tag is not a version like v1.14.0-net.1"; exit 1;
            }
            changelog=CHANGELOG.md
            case "$tag" in *-net.*) changelog=CHANGELOG-net.md ;; esac
            grep -q "^## \[${tag#v}\]" "$changelog" || {
              echo "::error::$changelog has no section for ${tag#v}; add one and run again"
              exit 1
            }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $tag; release: $publish"

  build:
    name: card tree
    needs: plan
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"

      # The version slot reports, and compares with versions.json when checking for updates.
      - name: Build the tree
        run: |
          set -eu
          case "$TAG" in v[0-9]*) export SLOT_VERSION="${TAG#v}" ;; esac
          task dist:device OUT="slot-${TAG}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${TAG}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          file "$out/System/bin/syncthing" | grep -q aarch64
          file "$out/System/bin/tailscaled" | grep -q aarch64
          file "$out/System/bin/tailscale" | grep -q aarch64
          test -f "$out/System/licenses/rcheevos-MIT.txt"
          test -f "$out/System/slotnet.sh"
          file "$out/System/gambatte_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          gambatte_src_sha="$(cat vendor/gambatte-src.sha)"
          test -f "$out/System/licenses/gambatte-${gambatte_src_sha}.tar.gz"
          test -f "$out/System/licenses/gambatte-${gambatte_src_sha}.meta"
          for p in cores/gambatte/*.patch; do
            test -f "$out/System/licenses/gambatte-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${TAG}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            CHANGELOG-net.md
            .github/scripts/versions.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          # This fork's releases (v1.9.0-net.1) keep their notes apart from upstream's.
          changelog=CHANGELOG.md
          case "$TAG" in *-net.*) changelog=CHANGELOG-net.md ;; esac
          awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$changelog" | sed -e '/./,$!d' > notes.md
          test -s notes.md
          # --target makes the tag at the built commit when the run did not start from one.
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

      # Devices read versions.json from the net branch (see LATEST in crates/slot/src/update.rs),
      # so it only changes once this release's zip is up and its digest known.
      - uses: actions/checkout@v7
        with:
          ref: net
          path: branch

      - name: Point the updater at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          OUT=branch/versions.json SLOT_REPO="$GITHUB_REPOSITORY" \
            LIVE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/net/versions.json" \
            bash .github/scripts/versions.sh
          # This fork's BaseOS is installed from the card only, never over the air.
          jq 'del(.baseos)' branch/versions.json > versions.json.new
          mv versions.json.new branch/versions.json
          cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "versions.json is already current"
            exit 0
          fi
          git commit -m "versions.json: $TAG"
          git push origin HEAD:net
